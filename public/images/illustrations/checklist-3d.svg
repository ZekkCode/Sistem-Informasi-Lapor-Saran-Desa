<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustrasi formulir checklist">
  <defs>
    <linearGradient id="board" x1="80" y1="70" x2="320" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0A15A"/>
      <stop offset="1" stop-color="#DE8438"/>
    </linearGradient>
    <linearGradient id="paper" x1="110" y1="90" x2="300" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3ECDD"/>
      <stop offset="1" stop-color="#E4D9C2"/>
    </linearGradient>
  </defs>

  <!-- bayangan lembut -->
  <ellipse cx="205" cy="360" rx="120" ry="20" fill="#153427" opacity="0.12"/>

  <g transform="rotate(-6 200 210)">
    <!-- sisi bawah papan untuk kesan tebal -->
    <rect x="86" y="82" width="228" height="266" rx="20" fill="#C9732C"/>
    <!-- permukaan papan -->
    <rect x="82" y="74" width="228" height="266" rx="20" fill="url(#board)"/>

    <!-- kertas -->
    <rect x="104" y="104" width="184" height="212" rx="8" fill="url(#paper)"/>
    <!-- lipatan sudut kertas -->
    <path d="M262 316h26l-26-26v26Z" fill="#D3C6AA"/>

    <!-- penjepit -->
    <rect x="170" y="60" width="52" height="26" rx="8" fill="#3A3A3A"/>
    <rect x="182" y="50" width="28" height="18" rx="6" fill="#2B2B2B"/>

    <!-- baris 1 (tercentang) -->
    <rect x="122" y="140" width="24" height="24" rx="5" fill="#EAF3EB" stroke="#4FA65B" stroke-width="3"/>
    <path d="m127 152 4 5 8-9" stroke="#3F9A50" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="160" y1="152" x2="266" y2="152" stroke="#8C8375" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 9"/>

    <!-- baris 2 (tercentang) -->
    <rect x="122" y="184" width="24" height="24" rx="5" fill="#EAF3EB" stroke="#4FA65B" stroke-width="3"/>
    <path d="m127 196 4 5 8-9" stroke="#3F9A50" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="160" y1="196" x2="266" y2="196" stroke="#8C8375" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 9"/>

    <!-- baris 3 (tercentang) -->
    <rect x="122" y="228" width="24" height="24" rx="5" fill="#EAF3EB" stroke="#4FA65B" stroke-width="3"/>
    <path d="m127 240 4 5 8-9" stroke="#3F9A50" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="160" y1="240" x2="266" y2="240" stroke="#8C8375" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 9"/>

    <!-- baris 4 (kosong) -->
    <rect x="122" y="272" width="24" height="24" rx="5" fill="#F3ECDD" stroke="#2B2B2B" stroke-width="3"/>
    <line x1="160" y1="284" x2="266" y2="284" stroke="#8C8375" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 9"/>
  </g>
</svg>
