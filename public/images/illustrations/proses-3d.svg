<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustrasi petugas memperbarui status">
  <defs>
    <linearGradient id="cardP" x1="90" y1="80" x2="300" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3ECDD"/>
      <stop offset="1" stop-color="#E4D9C2"/>
    </linearGradient>
    <linearGradient id="tabP" x1="90" y1="80" x2="300" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F6A4B"/>
      <stop offset="1" stop-color="#15503A"/>
    </linearGradient>
  </defs>

  <ellipse cx="205" cy="360" rx="120" ry="20" fill="#153427" opacity="0.12"/>

  <g transform="rotate(-5 200 210)">
    <!-- kartu bawah untuk kedalaman -->
    <rect x="92" y="86" width="216" height="248" rx="18" fill="#C9BFA6"/>
    <!-- kartu utama -->
    <rect x="88" y="78" width="216" height="248" rx="18" fill="url(#cardP)"/>
    <!-- tab hijau -->
    <path d="M88 96a18 18 0 0 1 18-18h180a18 18 0 0 1 18 18v26H88V96Z" fill="url(#tabP)"/>
    <rect x="112" y="94" width="120" height="12" rx="6" fill="#EAF3EB" opacity="0.85"/>

    <!-- timeline -->
    <line x1="128" y1="168" x2="128" y2="286" stroke="#C2B79E" stroke-width="3"/>

    <circle cx="128" cy="168" r="11" fill="#4FA65B"/>
    <path d="m123 168 4 4 7-8" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="150" y="160" width="120" height="10" rx="5" fill="#B9AE94"/>
    <rect x="150" y="176" width="84" height="8" rx="4" fill="#CDC3AB"/>

    <circle cx="128" cy="222" r="11" fill="#E08A3C"/>
    <circle cx="128" cy="222" r="4" fill="#fff"/>
    <rect x="150" y="214" width="108" height="10" rx="5" fill="#B9AE94"/>
    <rect x="150" y="230" width="72" height="8" rx="4" fill="#CDC3AB"/>

    <circle cx="128" cy="276" r="11" fill="#F3ECDD" stroke="#B9AE94" stroke-width="3"/>
    <rect x="150" y="268" width="96" height="10" rx="5" fill="#CDC3AB"/>
    <rect x="150" y="284" width="60" height="8" rx="4" fill="#D8CFB9"/>
  </g>

  <!-- lencana centang mengambang -->
  <g transform="translate(276 250)">
    <circle cx="0" cy="0" r="30" fill="#4FA65B"/>
    <circle cx="0" cy="0" r="30" fill="#4FA65B" opacity="0.35" transform="translate(0 6)"/>
    <path d="m-12 0 8 8 16-17" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
